name: Build & Push Docker Images

# Images go to this repository's GitHub Container Registry
# (ghcr.io/<owner>/vane), logged in with the workflow's own GITHUB_TOKEN, so
# no Docker Hub account or secret is needed. The upstream workflow pushed to
# the original author's Docker Hub account, which a fork cannot log in to.

on:
  push:
    branches:
      - master
      - canary
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vane

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - name: full
            dockerfile: Dockerfile
          - name: slim
            dockerfile: Dockerfile.slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release tag
        if: github.event_name == 'release'
        id: version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and push AMD64 Docker image (master)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          VARIANT=${{ matrix.variant.name }}
          docker buildx build --platform linux/amd64 \
            --cache-from=type=registry,ref=${IMAGE}:${VARIANT}-amd64 \
            --cache-to=type=inline \
            --provenance false \
            -f $DOCKERFILE \
            -t ${IMAGE}:${VARIANT}-amd64 \
            --push .

      - name: Build and push AMD64 Canary Docker image
        if: github.ref == 'refs/heads/canary' && github.event_name == 'push'
        run: |
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          VARIANT=${{ matrix.variant.name }}
          docker buildx build --platform linux/amd64 \
            --cache-from=type=registry,ref=${IMAGE}:${VARIANT}-canary-amd64 \
            --cache-to=type=inline \
            --provenance false \
            -f $DOCKERFILE \
            -t ${IMAGE}:${VARIANT}-canary-amd64 \
            --push .

      - name: Build and push AMD64 release Docker image
        if: github.event_name == 'release'
        run: |
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          VARIANT=${{ matrix.variant.name }}
          docker buildx build --platform linux/amd64 \
            --cache-from=type=registry,ref=${IMAGE}:${VARIANT}-${{ env.RELEASE_VERSION }}-amd64 \
            --cache-to=type=inline \
            --provenance false \
            -f $DOCKERFILE \
            -t ${IMAGE}:${VARIANT}-${{ env.RELEASE_VERSION }}-amd64 \
            --push .

  build-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        variant:
          - name: full
            dockerfile: Dockerfile
          - name: slim
            dockerfile: Dockerfile.slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release tag
        if: github.event_name == 'release'
        id: version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and push ARM64 Docker image (master)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          VARIANT=${{ matrix.variant.name }}
          docker buildx build --platform linux/arm64 \
            --cache-from=type=registry,ref=${IMAGE}:${VARIANT}-arm64 \
            --cache-to=type=inline \
            --provenance false \
            -f $DOCKERFILE \
            -t ${IMAGE}:${VARIANT}-arm64 \
            --push .

      - name: Build and push ARM64 Canary Docker image
        if: github.ref == 'refs/heads/canary' && github.event_name == 'push'
        run: |
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          VARIANT=${{ matrix.variant.name }}
          docker buildx build --platform linux/arm64 \
            --cache-from=type=registry,ref=${IMAGE}:${VARIANT}-canary-arm64 \
            --cache-to=type=inline \
            --provenance false \
            -f $DOCKERFILE \
            -t ${IMAGE}:${VARIANT}-canary-arm64 \
            --push .

      - name: Build and push ARM64 release Docker image
        if: github.event_name == 'release'
        run: |
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          VARIANT=${{ matrix.variant.name }}
          docker buildx build --platform linux/arm64 \
            --cache-from=type=registry,ref=${IMAGE}:${VARIANT}-${{ env.RELEASE_VERSION }}-arm64 \
            --cache-to=type=inline \
            --provenance false \
            -f $DOCKERFILE \
            -t ${IMAGE}:${VARIANT}-${{ env.RELEASE_VERSION }}-arm64 \
            --push .

  manifest:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [full, slim]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release tag
        if: github.event_name == 'release'
        id: version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Create and push manifest for main
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          VARIANT=${{ matrix.variant }}
          docker manifest create ${IMAGE}:${VARIANT}-latest \
            --amend ${IMAGE}:${VARIANT}-amd64 \
            --amend ${IMAGE}:${VARIANT}-arm64
          docker manifest push ${IMAGE}:${VARIANT}-latest

          if [ "$VARIANT" = "full" ]; then
            docker manifest create ${IMAGE}:latest \
              --amend ${IMAGE}:${VARIANT}-amd64 \
              --amend ${IMAGE}:${VARIANT}-arm64
            docker manifest push ${IMAGE}:latest

            docker manifest create ${IMAGE}:main \
              --amend ${IMAGE}:${VARIANT}-amd64 \
              --amend ${IMAGE}:${VARIANT}-arm64
            docker manifest push ${IMAGE}:main
          fi

      - name: Create and push manifest for canary
        if: github.ref == 'refs/heads/canary' && github.event_name == 'push'
        run: |
          VARIANT=${{ matrix.variant }}
          docker manifest create ${IMAGE}:${VARIANT}-canary \
            --amend ${IMAGE}:${VARIANT}-canary-amd64 \
            --amend ${IMAGE}:${VARIANT}-canary-arm64
          docker manifest push ${IMAGE}:${VARIANT}-canary

          if [ "$VARIANT" = "full" ]; then
            docker manifest create ${IMAGE}:canary \
              --amend ${IMAGE}:${VARIANT}-canary-amd64 \
              --amend ${IMAGE}:${VARIANT}-canary-arm64
            docker manifest push ${IMAGE}:canary
          fi

      - name: Create and push manifest for releases
        if: github.event_name == 'release'
        run: |
          VARIANT=${{ matrix.variant }}
          docker manifest create ${IMAGE}:${VARIANT}-${{ env.RELEASE_VERSION }} \
            --amend ${IMAGE}:${VARIANT}-${{ env.RELEASE_VERSION }}-amd64 \
            --amend ${IMAGE}:${VARIANT}-${{ env.RELEASE_VERSION }}-arm64
          docker manifest push ${IMAGE}:${VARIANT}-${{ env.RELEASE_VERSION }}

          if [ "$VARIANT" = "full" ]; then
            docker manifest create ${IMAGE}:${{ env.RELEASE_VERSION }} \
              --amend ${IMAGE}:${VARIANT}-${{ env.RELEASE_VERSION }}-amd64 \
              --amend ${IMAGE}:${VARIANT}-${{ env.RELEASE_VERSION }}-arm64
            docker manifest push ${IMAGE}:${{ env.RELEASE_VERSION }}
          fi
